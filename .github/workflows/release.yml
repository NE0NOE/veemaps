name: Build & Publish Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g. v2.0.0
  workflow_dispatch: # Allows manual trigger from GitHub web UI

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Package Web/PWA Assets (.zip)
        run: |
          zip -r veemaps-web-${{ github.ref_name }}.zip index.html manifest.json sw.js css js vendor

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk release-artifacts/veemaps-${{ github.ref_name }}.apk
          cp veemaps-web-${{ github.ref_name }}.zip release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/veemaps-${{ github.ref_name }}.apk
            release-artifacts/veemaps-web-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
